<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة السلطي - التمويل والالتزامات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">

    <!-- البانر العلوي الفخم مع اللوجو -->
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-b-3xl overflow-hidden shadow-2xl mb-6 relative">
        <!-- صورة البانر خلفية -->
        <div class="h-44 bg-cover bg-center relative" style="background-image: url('watermarked_img_5915543400542760214.jpg');">
            <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 to-slate-950/90"></div>
        </div>
        
        <!-- اللوجو العائم والعنوان -->
        <div class="relative -mt-16 text-center px-4 pb-6">
            <div class="inline-block relative">
                <img src="watermarked_img_5259144671765458912.jpg" alt="لوجو حاسبة السلطي" 
                     class="w-28 h-28 object-cover rounded-full border-4 border-slate-900 shadow-xl mx-auto bg-slate-800"
                     onerror="this.src='https://ui-avatars.com/api/?name=سلطي&background=1e293b&color=e2e8f0&size=128';">
            </div>
            <h1 class="text-3xl font-extrabold text-white mt-2 tracking-wide">حاسبة السلطي</h1>
            <p class="text-xs text-blue-400 font-medium mt-1">سداد الالتزامات واحتساب التمويل الشخصي</p>
        </div>
    </div>

    <!-- نموذج الحاسبة -->
    <main class="w-full max-w-lg px-4">
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الراتب الأساسي (ر.س)</label>
                    <input type="number" id="basicSalary" value="10000" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">أضعاف الراتب</label>
                    <input type="number" id="salaryMultiplier" value="18" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-300 mb-1">هل يوجد راتب إضافي؟</label>
                <select id="hasExtraSalary" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-center focus:border-blue-500 focus:outline-none">
                    <option value="no">لا يوجد</option>
                    <option value="yes">نعم يوجد</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-300 mb-1">التزامات العميل (مبلغ السداد)</label>
                <input type="number" id="commitments" value="50000" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-blue-500 focus:outline-none">
            </div>

            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-300 mb-1">نسبة عمولة المكتب (%)</label>
                <input type="number" id="commissionRate" value="5" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-blue-500 focus:outline-none">
            </div>

            <button onclick="calculateFinance()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2">
                <span>📊</span> حساب التقرير المالي
            </button>

            <!-- نتائج الحساب -->
            <div id="results" class="mt-6 bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm space-y-3">
                <div class="flex justify-between items-center text-slate-300">
                    <span>تمويل الراتب الأول:</span>
                    <span id="firstLoan" class="font-bold text-white">180,000 ر.س</span>
                </div>
                <div class="flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
                    <span>إجمالي التمويل الكامل:</span>
                    <span id="totalLoan" class="font-bold text-blue-400">180,000 ر.س</span>
                </div>
                <div class="flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
                    <span>سداد الالتزامات:</span>
                    <span id="commitmentsResult" class="font-bold text-rose-400">50,000 ر.س</span>
                </div>
                <div class="flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
                    <span>ربح المكتب:</span>
                    <span id="officeProfit" class="font-bold text-amber-400">9,000 ر.س</span>
                </div>
            </div>

        </div>
    </main>

    <script>
        function calculateFinance() {
            const basic = parseFloat(document.getElementById('basicSalary').value) || 0;
            const mult = parseFloat(document.getElementById('salaryMultiplier').value) || 0;
            const comm = parseFloat(document.getElementById('commitments').value) || 0;
            const rate = parseFloat(document.getElementById('commissionRate').value) || 0;

            const total = basic * mult;
            const profit = total * (rate / 100);

            document.getElementById('firstLoan').innerText = total.toLocaleString('ar-SA') + ' ر.س';
            document.getElementById('totalLoan').innerText = total.toLocaleString('ar-SA') + ' ر.س';
            document.getElementById('commitmentsResult').innerText = comm.toLocaleString('ar-SA') + ' ر.س';
            document.getElementById('officeProfit').innerText = profit.toLocaleString('ar-SA') + ' ر.س';
        }
    </script>
</body>
</html>
