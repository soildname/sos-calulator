<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة السلطي - الحاسبة الأولى في الشرق الأوسط</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Tajawal', sans-serif;
background-color: #0b0f19;
color: #f1f5f9;
}
/* تصميم البانر الهيدر */
.banner-header {
background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #0b0f19 100%);
border-bottom: 1px solid rgba(217, 119, 6, 0.2);
}
</style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">
<!-- البانر العلوي الهيدر المدمج مع الشعار -->
<header class="w-full max-w-lg border-b border-x border-slate-800 rounded-b-3xl overflow-hidden shadow-2xl mb-6 banner-header">
<div class="px-4 pt-8 pb-6 text-center flex flex-col items-center">
<!-- اللوجو الفخم (مصمم بدقة بلون كحلي وذهبي ومدمج كودياً) -->
<div class="relative mb-3">
<div class="w-28 h-28 rounded-full border-4 border-amber-500/80 shadow-2xl bg-slate-950 flex flex-col items-center justify-center p-2 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-950 opacity-90"></div>
<div class="relative z-10 flex flex-col items-center justify-center">
<!-- Crown Vector -->
<svg class="w-8 h-8 text-amber-400 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24">
<path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
</svg>
<!-- Arabic S -->
<span class="text-amber-400 font-black text-2xl tracking-widest -mt-1 leading-none drop-shadow">س</span>
<span class="text-slate-300 text-[9px] font-bold tracking-tighter mt-0.5">السلطي</span>
</div>
</div>
</div>
<!-- العنوان والوصف -->
<h1 class="text-3xl font-extrabold text-white tracking-wide">حاسبة السلطي</h1>
<p class="text-xs text-amber-400 font-bold mt-1 tracking-wider bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
🌟 الحاسبة الأولى في الشرق الأوسط
</p>
</div>
</header>
<!-- نموذج الحاسبة -->
<main class="w-full max-w-lg px-4">
<div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-2xl backdrop-blur-md space-y-4">
<!-- الراتب الأساسي وأضعافه -->
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">الراتب الأساسي (ر.س)</label>
<input type="number" id="basicSalary" value="8900" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
</div>
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">أضعاف الراتب الأول</label>
<input type="number" id="salaryMultiplier" value="28" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
</div>
</div>
<!-- خيار الراتب الإضافي -->
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">هل يوجد راتب إضافي / إضافات؟</label>
<select id="hasExtraSalary" onchange="toggleExtraSalary(); calculateFinance();" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-medium text-center focus:border-amber-500 focus:outline-none">
<option value="no">لا يوجد</option>
<option value="yes">نعم يوجد</option>
</select>
</div>
<!-- حقول الراتب الإضافي (تظهر عند الاختيار) -->
<div id="extraSalaryContainer" class="hidden grid-cols-2 gap-3 bg-slate-950/60 p-3 rounded-2xl border border-slate-800">
<div>
<label class="block text-xs font-semibold text-amber-400 mb-1">الراتب الإضافي (ر.س)</label>
<input type="number" id="extraSalary" value="0" oninput="calculateFinance()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
</div>
<div>
<label class="block text-xs font-semibold text-amber-400 mb-1">أضعاف الراتب الإضافي</label>
<input type="number" id="extraMultiplier" value="0" oninput="calculateFinance()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
</div>
</div>
<!-- التزامات العميل -->
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">التزامات العميل (مبلغ السداد)</label>
<input type="number" id="commitments" value="190000" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
</div>
<!-- نسبة المكتب -->
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">نسبة عمولة المكتب (%)</label>
<input type="number" id="commissionRate" value="8" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
</div>
<!-- زر الاحتساب -->
<button onclick="calculateFinance()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black py-3.5 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2 mt-2">
<span>📊</span> احتساب التقرير المالي
</button>
<!-- تفاصيل النتائج الممالية -->
<div id="results" class="mt-5 bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm space-y-3">
<div class="flex justify-between items-center text-slate-300">
<span>تمويل الراتب الأساسي:</span>
<span id="basicLoanResult" class="font-bold text-white">249,200 ر.س</span>
</div>
<div id="extraLoanRow" class="hidden justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
<span>تمويل الراتب الإضافي:</span>
<span id="extraLoanResult" class="font-bold text-amber-400">0 ر.س</span>
</div>
<div class="flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
<span>إجمالي التمويل الكامل:</span>
<span id="totalLoan" class="font-bold text-blue-400">249,200 ر.س</span>
</div>
<div class="flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
<span>سداد الالتزامات:</span>
<span id="commitmentsResult" class="font-bold text-rose-400">190,000 ر.س</span>
</div>
<div class="flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
<span>ربح المكتب (العمولة):</span>
<span id="officeProfit" class="font-bold text-amber-400">19,936 ر.س</span>
</div>
<!-- صافي العميل المتبقي -->
<div class="flex justify-between items-center text-slate-100 border-t border-slate-700 pt-3 text-base bg-emerald-950/40 -mx-4 -mb-4 p-4 rounded-b-2xl border-emerald-500/30">
<span class="font-bold text-emerald-400">صافي العميل (المبلغ المتبقي):</span>
<span id="netClient" class="font-extrabold text-emerald-400 text-lg">39,264 ر.س</span>
</div>
</div>
</div>
</main>
<script>
function toggleExtraSalary() {
const hasExtra = document.getElementById('hasExtraSalary').value;
const container = document.getElementById('extraSalaryContainer');
const row = document.getElementById('extraLoanRow');
if (hasExtra === 'yes') {
container.classList.remove('hidden');
container.classList.add('grid');
row.classList.remove('hidden');
row.classList.add('flex');
} else {
container.classList.add('hidden');
container.classList.remove('grid');
row.classList.add('hidden');
row.classList.remove('flex');
document.getElementById('extraSalary').value = 0;
document.getElementById('extraMultiplier').value = 0;
}
}
function calculateFinance() {
const basic = parseFloat(document.getElementById('basicSalary').value) || 0;
const mult = parseFloat(document.getElementById('salaryMultiplier').value) || 0;
const extra = parseFloat(document.getElementById('extraSalary').value) || 0;
const extraMult = parseFloat(document.getElementById('extraMultiplier').value) || 0;
const comm = parseFloat(document.getElementById('commitments').value) || 0;
const rate = parseFloat(document.getElementById('commissionRate').value) || 0;
const basicLoan = basic * mult;
const extraLoan = extra * extraMult;
const totalLoan = basicLoan + extraLoan;
const profit = totalLoan * (rate / 100);
const net = totalLoan - comm - profit;
document.getElementById('basicLoanResult').innerText = basicLoan.toLocaleString('ar-SA') + ' ر.س';
document.getElementById('extraLoanResult').innerText = extraLoan.toLocaleString('ar-SA') + ' ر.س';
document.getElementById('totalLoan').innerText = totalLoan.toLocaleString('ar-SA') + ' ر.س';
document.getElementById('commitmentsResult').innerText = comm.toLocaleString('ar-SA') + ' ر.س';
document.getElementById('officeProfit').innerText = profit.toLocaleString('ar-SA') + ' ر.س';
const netElem = document.getElementById('netClient');
netElem.innerText = net.toLocaleString('ar-SA') + ' ر.س';
if (net < 0) {
netElem.className = "font-extrabold text-rose-500 text-lg";
} else {
netElem.className = "font-extrabold text-emerald-400 text-lg";
}
}
// الحساب عند التشغيل
window.onload = function() {
calculateFinance();
};
</script>
</body>
</html>
