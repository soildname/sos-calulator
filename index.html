<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة السلطي - الحاسبة الأولى في الشرق الأوسط</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        .banner-gradient {
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0b132b 100%);
        }
        .gold-glow {
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.25);
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">

    <!-- البانر العلوي المدمج مع اللوجو -->
    <div class="w-full max-w-lg bg-slate-900 border-b border-x border-slate-800 rounded-b-3xl overflow-hidden shadow-2xl mb-6 relative">
        <div class="h-44 banner-gradient relative flex items-center justify-center border-b border-amber-500/30 overflow-hidden">
            <!-- زخرفة خلفية البانر -->
            <div class="absolute inset-0 opacity-20">
                <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f59e0b" stroke-width="0.5"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#grid)" />
                </svg>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
        </div>
        
        <!-- اللوجو والعنوان -->
        <div class="relative -mt-20 text-center px-4 pb-6">
            <div class="inline-block relative">
                <div class="w-28 h-28 rounded-full border-4 border-slate-900 gold-glow mx-auto bg-slate-950 flex flex-col items-center justify-center p-2 border-amber-500/60 relative z-10">
                    <svg class="w-12 h-12 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    <span class="text-amber-400 font-extrabold text-xs tracking-wider mt-1">السلطي</span>
                </div>
            </div>
            <h1 class="text-3xl font-extrabold text-white mt-3 tracking-wide">حاسبة السلطي</h1>
            <p class="text-xs text-amber-400 font-bold mt-1 tracking-wider">🌟 الحاسبة الأولى في الشرق الأوسط</p>
        </div>
    </div>

    <!-- نموذج الحاسبة -->
    <main class="w-full max-w-lg px-4">
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
            
            <!-- الراتب الأساسي وأضعافه -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الراتب الأساسي (ر.س)</label>
                    <input type="number" id="basicSalary" value="10000" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">أضعاف الراتب</label>
                    <input type="number" id="salaryMultiplier" value="18" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <!-- خيار الراتب الإضافي -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-300 mb-1">هل يوجد راتب إضافي؟</label>
                <select id="hasExtraSalary" onchange="toggleExtraSalary()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-center focus:border-amber-500 focus:outline-none">
                    <option value="no">لا يوجد</option>
                    <option value="yes">نعم يوجد</option>
                </select>
            </div>

            <!-- حقول الراتب الإضافي -->
            <div id="extraSalaryContainer" class="hidden grid grid-cols-2 gap-4 mb-4 p-3 bg-slate-950/60 border border-slate-800 rounded-xl">
                <div>
                    <label class="block text-xs font-semibold text-amber-400 mb-1">الراتب الإضافي (ر.س)</label>
                    <input type="number" id="extraSalary" value="0" oninput="calculateFinance()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-400 mb-1">أضعاف الراتب الإضافي</label>
                    <input type="number" id="extraMultiplier" value="18" oninput="calculateFinance()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <!-- الالتزامات -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-300 mb-1">التزامات العميل (مبلغ السداد)</label>
                <input type="number" id="commitments" value="50000" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
            </div>

            <!-- خيار عمولة المكتب (اختياري) -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-300 mb-1">عمولة المكتب</label>
                <select id="commissionMode" onchange="toggleCommission()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-center focus:border-amber-500 focus:outline-none mb-2">
                    <option value="none">لا يوجد عمولة</option>
                    <option value="percent">نسبة مئوية (%)</option>
                    <option value="fixed">مبلغ ثابت (ر.س)</option>
                </select>

                <div id="commissionInputContainer" class="hidden mt-2">
                    <label id="commissionLabel" class="block text-xs font-semibold text-amber-400 mb-1 text-center">قيمة العمولة</label>
                    <input type="number" id="commissionValue" value="5" oninput="calculateFinance()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <button onclick="calculateFinance()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-extrabold py-3 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2">
                <span>📊</span> احتساب التقرير المالي
            </button>

            <!-- التقرير المالي -->
            <div id="results" class="mt-6 bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm space-y-3">
                <div class="flex justify-between items-center text-slate-300">
                    <span>إجمالي التمويل الكامل:</span>
                    <span id="totalLoan" class="font-bold text-blue-400">180,000 ر.س</span>
                </div>
                <div class="flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
                    <span>سداد الالتزامات:</span>
                    <span id="commitmentsResult" class="font-bold text-rose-400">50,000 ر.س</span>
                </div>
                <div id="profitRow" class="hidden flex justify-between items-center text-slate-300 border-t border-slate-800/60 pt-2">
                    <span>ربح المكتب (العمولة):</span>
                    <span id="officeProfit" class="font-bold text-amber-400">0 ر.س</span>
                </div>
                <!-- صافي العميل -->
                <div class="flex justify-between items-center text-slate-100 border-t border-slate-700 pt-3 text-base bg-emerald-950/40 -mx-4 -mb-4 p-4 rounded-b-2xl border-emerald-500/30">
                    <span class="font-bold text-emerald-400">صافي العميل (المبلغ المتبقي):</span>
                    <span id="netClient" class="font-extrabold text-emerald-400 text-lg">130,000 ر.س</span>
                </div>
            </div>

        </div>
    </main>

    <script>
        function toggleExtraSalary() {
            const hasExtra = document.getElementById('hasExtraSalary').value;
            const container = document.getElementById('extraSalaryContainer');
            if (hasExtra === 'yes') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                document.getElementById('extraSalary').value = 0;
            }
            calculateFinance();
        }

        function toggleCommission() {
            const mode = document.getElementById('commissionMode').value;
            const container = document.getElementById('commissionInputContainer');
            const label = document.getElementById('commissionLabel');
            const profitRow = document.getElementById('profitRow');

            if (mode === 'none') {
                container.classList.add('hidden');
                profitRow.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
                profitRow.classList.remove('hidden');
                if (mode === 'percent') {
                    label.innerText = 'نسبة العمولة (%)';
                } else {
                    label.innerText = 'مبلغ العمولة الثابت (ر.س)';
                }
            }
            calculateFinance();
        }

        function calculateFinance() {
            const basic = parseFloat(document.getElementById('basicSalary').value) || 0;
            const mult = parseFloat(document.getElementById('salaryMultiplier').value) || 0;
            const extra = parseFloat(document.getElementById('extraSalary').value) || 0;
            const extraMult = parseFloat(document.getElementById('extraMultiplier').value) || 0;
            const comm = parseFloat(document.getElementById('commitments').value) || 0;

            const total = (basic * mult) + (extra * extraMult);

            const commMode = document.getElementById('commissionMode').value;
            const commVal = parseFloat(document.getElementById('commissionValue').value) || 0;

            let profit = 0;
            if (commMode === 'percent') {
                profit = total * (commVal / 100);
            } else if (commMode === 'fixed') {
                profit = commVal;
            }

            const net = total - comm - profit;

            document.getElementById('totalLoan').innerText = total.toLocaleString('ar-SA') + ' ر.س';
            document.getElementById('commitmentsResult').innerText = comm.toLocaleString('ar-SA') + ' ر.س';
            document.getElementById('officeProfit').innerText = profit.toLocaleString('ar-SA') + ' ر.س';
            document.getElementById('netClient').innerText = net.toLocaleString('ar-SA') + ' ر.س';
        }

        window.onload = function() {
            toggleCommission();
            calculateFinance();
        };
    </script>
</body>
</html>
